<!DOCTYPE html>

<head>

<title>Insight | Handcraft Myanmar</title>
<meta name="description" content="Handcraft Myanmar Insight article.">
<link rel="stylesheet" href="assets/style.css">
<style>
:root{--green:#1f8a57;--gold:#b18a52;--ink:#20211f;--muted:#6e706b;--line:#dfded8}
.article-hero{padding:70px 0 45px;background:linear-gradient(125deg,#f8f7f3,#efeee9);border-bottom:1px solid var(--line)}
.article-kicker{color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
.article-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,6vw,76px);line-height:.98;letter-spacing:-.05em;max-width:980px;margin:16px 0}
.article-meta{color:var(--muted);font-size:12px}
.article-wrap{padding:55px 0 100px}
.article-content{max-width:900px;margin:0 auto}
.article-cover{width:100%;max-height:560px;object-fit:cover;display:block;margin-bottom:45px}
.article-body{font-size:16px;line-height:1.9;color:#333}
.article-body h2,.article-body h3{font-family:Georgia,"Times New Roman",serif;color:var(--ink);line-height:1.2;margin:40px 0 14px}
.article-body p{margin:0 0 20px}
.article-body img{max-width:100%;height:auto}
.article-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:40px;padding-top:25px;border-top:1px solid var(--line)}
.article-actions a,.article-actions button{border:1px solid #cfcfc8;background:#fff;color:var(--ink);padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer}
.article-actions a:hover,.article-actions button:hover{border-color:var(--green);color:var(--green)}
.article-error{text-align:center;padding:80px 20px;color:var(--muted)}
</style>
</head>
<body>

      <small data-setting="brand_subtitle">MYANMAR</small>
    </a>
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu">☰</button>
    <nav class="main-nav" id="mainNav">
      <a href="index.html#home">Home</a>
      <a href="index.html#about">About Us</a>
      <a href="index.html#projects">Projects</a>
      <a href="insights.html">Insights</a>
      <a href="team.html">Our Team</a>
      <a href="index.html#contact">Contact Us</a>
    </nav>
  </div>
</header>

<main id="articleRoot">
  <section class="article-hero">
    <div class="container">
      <div class="article-kicker">Handcraft Myanmar / Insight</div>
      <h1 class="article-title" id="articleTitle">Loading…</h1>
      <div class="article-meta" id="articleMeta"></div>
    </div>
  </section>

  <section class="article-wrap">
    <div class="container">
      <article class="article-content" id="articleContent">
        <div class="article-error">Loading insight...</div>

    </div>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-company">
      <strong data-setting="company_name">HANDCRAFT MYANMAR COMPANY LIMITED</strong>

    </div>

    <div class="footer-links">
      <a href="index.html#home">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#projects">Projects</a>
      <a href="insights.html">Insights</a>
      <a href="team.html">Our Team</a>
      <a href="index.html#contact">Contact</a>
    </div>

    <div class="footer-socials" aria-label="Social media">
      <a data-setting="facebook_url" href="#" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3c-3.3 0-5 1.9-5 5v3H6v4h3v4h3.2l.8-4H13V9.4c0-.9.3-1.4 1-1.4z"/></svg></a>
      <a data-setting="instagram_url" href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram"><svg class="instagram-outline" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.4" cy="6.7" r="1.2" fill="currentColor" stroke="none"></circle></svg></a>
      <a data-setting="tiktok_url" href="#" target="_blank" rel="noopener noreferrer" aria-label="TikTok" title="TikTok"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4v10.1a4.9 4.9 0 1 1-4-4.8v3.1a1.9 1.9 0 0 0 1 1.7V4h3c.3 2 1.7 3.5 3.7 3.8V11c-1.4-.1-2.7-.6-3.7-1.4V14a4.9 4.9 0 1 1-3.9-4.8V6.5A7.7 7.7 0 0 0 14 4z"/></svg></a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js?v=7"></script>
<script>
const SUPABASE_URL="https://jvaqtuiyswjybasfumjw.supabase.co";
const SUPABASE_KEY="sb_publishable_GteenSO57Kw0uv1qm6YUiw_-uZ7Uwe0";

const esc=v=>String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));

function formatDate(value){
  if(!value)return "";
  const d=new Date(value);
  return Number.isNaN(d.getTime()) ? "" : d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
}

function renderContent(value){
  if(!value)return "<p>No article content is available yet.</p>";
  const text=String(value).trim();
  if(/<[^>]+>/.test(text)) return text;
  return text.split(/\n{2,}/).map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
}

async function loadArticle(){
  const slug=new URLSearchParams(location.search).get("slug");
  const title=document.getElementById("articleTitle");
  const meta=document.getElementById("articleMeta");
  const content=document.getElementById("articleContent");

  if(!slug){
    title.textContent="Insight not found";
    content.innerHTML='<div class="article-error">No insight slug was provided.<br><br><a href="insights.html">← Back to Insights</a></div>';
    return;
  }

  try{
    const query=new URLSearchParams({
      select:"id,slug,title,category,excerpt,content,cover_image_url,published_at,created_at,published",
      slug:`eq.${slug}`,
      limit:"1"
    });

    const r=await fetch(`${SUPABASE_URL}/rest/v1/insights?${query}`,{
      headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,Accept:"application/json"}
    });

    if(!r.ok) throw new Error(`Supabase returned HTTP ${r.status}`);

    const rows=await r.json();
    const item=rows[0];

    if(!item || item.published===false){
      title.textContent="Insight not found";
      content.innerHTML='<div class="article-error">This insight is unavailable.<br><br><a href="insights.html">← Back to Insights</a></div>';
      return;
    }

    title.textContent=item.title || "Insight";
    meta.textContent=[item.category,formatDate(item.published_at||item.created_at)].filter(Boolean).join(" • ");

    content.innerHTML=`
      ${item.cover_image_url ? `<img class="article-cover" src="${esc(item.cover_image_url)}" alt="${esc(item.title)}">` : ""}
      <div class="article-body">${renderContent(item.content || item.excerpt)}</div>
      <div class="article-actions">
        <a href="insights.html">← Back to Insights</a>
        <button type="button" id="shareBtn">Share</button>
        <button type="button" id="copyBtn">Copy Link</button>
      </div>
    `;

    document.getElementById("shareBtn").addEventListener("click",async()=>{
      if(navigator.share){
        try{await navigator.share({title:item.title,url:location.href});}catch(_){}
      }else{
        await navigator.clipboard?.writeText(location.href);
        alert("Link copied.");
      }
    });

    document.getElementById("copyBtn").addEventListener("click",async()=>{
      try{
        await navigator.clipboard.writeText(location.href);
        document.getElementById("copyBtn").textContent="Copied";
        setTimeout(()=>document.getElementById("copyBtn").textContent="Copy Link",1500);
      }catch(_){
        alert(location.href);
      }
    });

    document.title=`${item.title} | Handcraft Myanmar`;

  }catch(error){
    console.error(error);
    title.textContent="Unable to load insight";
    content.innerHTML=`<div class="article-error">${esc(error.message||"Unknown error")}<br><br><a href="insights.html">← Back to Insights</a></div>`;
  }
}

const menuToggle=document.getElementById("menuToggle");
const mainNav=document.getElementById("mainNav");
if(menuToggle&&mainNav){
  menuToggle.addEventListener("click",()=>mainNav.classList.toggle("open"));
  mainNav.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>mainNav.classList.remove("open")));
}
document.getElementById("year").textContent=new Date().getFullYear();
loadArticle();
</script>
</body>
