<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handcraft Admin</title><link rel="stylesheet" href="../assets/style.css"><style>
body{background:#f6f4ef}.admin{max-width:1000px;margin:110px auto;padding:0 25px}.panel{background:#fff;padding:28px;margin:20px 0;border:1px solid #ddd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{font-size:13px;font-weight:700}input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;margin-top:5px;font:inherit}textarea{min-height:100px}.full{grid-column:1/-1}.row{display:flex;gap:10px;align-items:center}.project-row{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center;border-top:1px solid #ddd;padding:12px 0}.project-row img{width:90px;height:65px;object-fit:cover}.danger{background:#8d2222!important;color:#fff!important}.notice{padding:12px;background:#f0eee8;margin-bottom:15px}
</style></head><body><div class="admin">
<a href="../">← View website</a><h1>Handcraft Admin</h1>
<div id="login" class="panel"><h2>Admin Login</h2><p>Only your Supabase-authenticated admin account can access this panel.</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn" id="loginBtn">Login</button><p id="loginMsg"></p></div>
<div id="dashboard" hidden>
<div class="panel"><div class="row" style="justify-content:space-between"><h2>Add / Edit Project</h2><button class="btn ghost" id="logoutBtn">Logout</button></div>
<form id="projectForm" class="grid"><input type="hidden" id="id"><label>Project title<input id="title" required></label><label>Category<select id="category"><option>Residential</option><option>Commercial</option><option>Office</option><option>Retail</option><option>Hospitality</option><option>Other</option></select></label><label>Location<input id="location"></label><label>Sort order<input id="sort" type="number" value="0"></label><label class="full">Description<textarea id="description"></textarea></label><label class="full">Project image<input id="image" type="file" accept="image/*"></label><label><input id="published" type="checkbox" checked> Published</label><div><button class="btn" type="submit">Save Project</button> <button class="btn" type="button" id="cancelBtn">Cancel</button></div></form><p id="formMsg"></p></div>
<div class="panel"><h2>Projects</h2><div id="list"></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
